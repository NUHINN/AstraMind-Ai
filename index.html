<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AstraMind AI is a futuristic student productivity dashboard with AI planning, focus tools, analytics, goals, and simulated assistant behavior."
    />
    <title>AstraMind AI | Student Productivity OS</title>
    <script>
      tailwind = {
        config: {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                abyss: "#070B14",
                ink: "#0B1020",
                neon: "#9B5CFF",
                volt: "#2F80FF",
                cyan: "#5EE7F5"
              },
              fontFamily: {
                inter: ["Inter", "sans-serif"],
                poppins: ["Poppins", "sans-serif"],
                space: ["Space Grotesk", "sans-serif"]
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "react-router-dom": "https://esm.sh/react-router-dom@6.26.2?external=react,react-dom",
          "framer-motion": "https://esm.sh/framer-motion@11.3.31?external=react,react-dom",
          "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
          "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.25.7/babel.min.js"></script>
  </head>
  <body class="bg-abyss text-white antialiased">
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#f8fbff;font-family:Inter,system-ui,sans-serif;">
        <div style="max-width:560px;border:1px solid rgba(143,160,214,.22);background:rgba(10,17,34,.72);border-radius:12px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.36);backdrop-filter:blur(18px);">
          <p style="margin:0 0 8px;color:#5ee7f5;font-size:13px;text-transform:uppercase;letter-spacing:.18em;">AstraMind AI</p>
          <h1 style="margin:0 0 12px;font-size:30px;line-height:1.1;">Starting the app...</h1>
          <p style="margin:0;color:#9faad1;line-height:1.65;">
            If this stays on screen, open the project through the local server instead of the file URL:
            <strong style="color:#fff;">node server.mjs</strong>, then visit
            <strong style="color:#fff;">http://localhost:5173</strong>.
          </p>
        </div>
      </div>
    </div>
    <script type="text/babel" data-type="module" src="./src/app.jsx"></script>
  </body>
</html>
